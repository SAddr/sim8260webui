server.document-root = "/usrdata/simcom-webui/www"
server.port = 8888

# =====================================================================
# 日志：全部落在内存文件系统上，不写 NAND
#   · @RUNDIR@ 由 install.sh 在安装时替换为「运行时目录」——它是读
#     /proc/mounts 解析出来的内存目录（tmpfs/ramfs，见仓库根目录 at-runenv.sh）。
#   · 不开启 access log：面板只有一个客户端，访问日志的唯一作用就是把每个
#     请求都写一遍盘（NAND 磨损的经典来源）。排查看 errorlog 与 CGI 返回即可。
#   · errorlog 只记错误，量很小；而且同样在内存里，重启即失。
#   · 临时文件目录也指向内存（CGI 子进程继承）。
# =====================================================================
server.errorlog = "@RUNDIR@/lighttpd-error.log"
tmpdir = "@RUNDIR@/lighttpd-tmp"
# accesslog.filename 故意不设置（保持 lighttpd 默认：关闭访问日志）

# --- 模块 ---
server.modules = (
    "mod_alias",
    "mod_auth",
    "mod_authn_file",
    "mod_cgi",
    "mod_setenv"
)

index-file.names = ( "index.html" )

# --- MIME 类型（否则浏览器会弹下载框） ---
mimetype.assign = (
  ".html" => "text/html; charset=utf-8",
  ".htm"  => "text/html; charset=utf-8",
  ".css"  => "text/css; charset=utf-8",
  ".js"   => "application/javascript",
  ".json" => "application/json",
  ".svg"  => "image/svg+xml",
  ".png"  => "image/png",
  ".jpg"  => "image/jpeg",
  ".jpeg" => "image/jpeg",
  ".ico"  => "image/x-icon",
  ".txt"  => "text/plain; charset=utf-8",
  ""      => "application/octet-stream"
)

# CGI：/cgi-bin/ 下脚本执行
# 注意：cgi-bin 目录在 www 外面（../cgi-bin/），
# 所以必须用 alias.url 把 /cgi-bin/ 映射到真实路径，
# 否则 lighttpd 会去 www/cgi-bin/ 下找（404）。
$HTTP["url"] =~ "^/cgi-bin/" {
    alias.url += ( "/cgi-bin/" => "/usrdata/simcom-webui/cgi-bin/" )
    cgi.assign = ( "" => "" )
}

# ---- 静态资源缓存 ----
# 图片/图标可以长缓存（内容基本不变）。
# 但 css/js **不能**长缓存：升级 WebUI 后，浏览器若还拿着 24 小时前的
# i18n.js / styles.css，新功能和修复就看不到，表现为「明明升级了却还是旧界面」，
# 排查起来很像"文件没部署上去"。这里改成 no-cache —— 每次使用前仍会向服务器
# 校验，未变更时由 lighttpd 的 ETag/Last-Modified 返回 304，并不会真的重复下载。
$HTTP["url"] =~ "\.(ico|png|jpg|jpeg|svg)$" {
    setenv.add-response-header = ( "Cache-Control" => "max-age=86400" )
}
$HTTP["url"] =~ "\.(css|js)$" {
    setenv.add-response-header = ( "Cache-Control" => "no-cache" )
}

# ---- 基本认证 ----
auth.backend = "htpasswd"
auth.backend.htpasswd.userfile = "/usrdata/simcom-webui/.htpasswd"

# 修改密码的 CGI 允许匿名访问（需填旧密码才能改；匿名重置已在 CGI 内禁止）
# 注意：必须用 else 结构，而不是并列的 == / !~ 两个条件，
# 否则 lighttpd 条件合并语义会导致认证范围不明确。
$HTTP["url"] == "/cgi-bin/password" {
    # 不做认证
}
else $HTTP["url"] =~ "^/" {
    auth.require = ( "/" => (
        "method" => "basic",
        "realm" => "SIM8260 Control Center",
        "require" => "valid-user"
    ))
}

